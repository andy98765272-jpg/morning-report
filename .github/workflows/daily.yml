name: 每日晨報資料更新

on:
  schedule:
    # 台北時間週二到週六 07:00（UTC 前一天 23:00），美股收盤後、台股開盤前
    - cron: "0 23 * * 1-5"
    # 台北時間週一 07:00，更新週五夜盤與週末新聞
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch/fetch.py
      - name: 存回資料
        run: |
          git config user.name "morning-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push
